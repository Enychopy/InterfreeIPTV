name: Construir INTERFREE TV PRO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Descargar Apktool 2.11.1 y Uber APK Signer 1.3.0
        run: |
          curl -L --fail -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          curl -L --fail -o uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Descargar APK original (ibo-original)
        uses: dsaltares/fetch-gh-release-asset@master
        with:
          repo: Enychopy/InterfreeIPTV
          version: tags/ibo-original
          file: Red4TVibo.apk
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Descompilar APK
        run: java -jar apktool.jar d -f Red4TVibo.apk -o decoded

      - name: Cambiar paquete, nombre y permiso conflictivo
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = [
              ("com.apps.red4tv", "com.interfree.tvpro"),
              ("com.apps.amigostv.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSIONbpwsck", "com.interfree.tvpro.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"),
              ("Red4TV", "INTERFREE TV PRO"),
          ]

          root = Path("decoded")
          for file in root.rglob("*"):
              if file.is_file():
                  try:
                      content = file.read_text(encoding="utf-8")
                      updated = content
                      for old, new in replacements:
                          updated = updated.replace(old, new)
                      if updated != content:
                          file.write_text(updated, encoding="utf-8")
                  except (UnicodeDecodeError, OSError):
                      pass
          PY

      - name: Instalar logo INTERFREE TV PRO
        run: |
          python3 -m pip install --break-system-packages Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          png_files = sorted(Path(".").glob("*.png"))
          if not png_files:
              raise FileNotFoundError("No se encontro ningun archivo .png en el repositorio")

          logo_path = png_files[0]
          print(f"Usando logo: {logo_path}")
          logo = Image.open(logo_path).convert("RGBA")

          root = Path("decoded/res")
          count = 0

          for file in root.rglob("*"):
              if not file.is_file():
                  continue
              if file.suffix.lower() not in (".png", ".webp"):
                  continue
              name = file.stem.lower()
              if "ic_launcher" not in name and "launcher_icon" not in name:
                  continue
              try:
                  with Image.open(file) as original:
                      size = original.size
                  resized = logo.resize(size, Image.Resampling.LANCZOS)
                  resized.save(file)
                  count += 1
              except Exception:
                  pass

          print(f"Iconos actualizados: {count}")
          PY

      - name: Recompilar APK
        run: java -jar apktool.jar b decoded -o INTERFREE-TV-PRO-UNALIGNED.apk

      - name: Firmar APK con Uber APK Signer (V3)
        run: java -jar uber-apk-signer.jar -a INTERFREE-TV-PRO-UNALIGNED.apk --allowResign -o ./build_final

      - name: Subir APK final
        uses: actions/upload-artifact@v4
        with:
          name: INTERFREE-TV-PRO-FINAL
          path: ./build_final/*.apk
