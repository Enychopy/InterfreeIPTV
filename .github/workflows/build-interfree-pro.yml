name: Construir INTERFREE TV PRO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Descargar Apktool 2.11.1 y Uber APK Signer 1.3.0
        run: |
          curl -L --fail -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          curl -L --fail -o uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Descargar APK original (ibo-original)
        uses: dsaltares/fetch-gh-release-asset@master
        with:
          repo: Enychopy/InterfreeIPTV
          version: tags/ibo-original
          file: Red4TVibo.apk
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Descompilar APK
        run: java -jar apktool.jar d -f Red4TVibo.apk -o decoded

      - name: Cambiar paquete, nombre, permiso conflictivo y quitar texto Cali TV
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          root = Path("decoded")

          # 1. Reemplazos en codigo smali
          for smali in root.glob("smali*"):
              for file in smali.rglob("*.smali"):
                  content = file.read_text(encoding="utf-8", errors="ignore")
                  updated = content.replace("com.apps.red4tv", "com.interfree.tvpro")
                  updated = updated.replace(
                      "com.apps.amigostv.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSIONbpwsck",
                      "com.interfree.tvpro.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION",
                  )
                  updated = re.sub(r"Bienvenido a Cali(\s*TV)?", "", updated, flags=re.IGNORECASE)
                  updated = re.sub(r"Cali\s*TV", "INTERFREE TV PRO", updated, flags=re.IGNORECASE)
                  if updated != content:
                      file.write_text(updated, encoding="utf-8")

          # 2. Limpiar texto en assets (languages.json)
          assets_dir = root / "assets"
          if assets_dir.exists():
              for file in assets_dir.rglob("*"):
                  if not file.is_file():
                      continue
                  try:
                      content = file.read_text(encoding="utf-8")
                      updated = re.sub(r"Bienvenido a Cali(\s*TV)?", "", content, flags=re.IGNORECASE)
                      updated = re.sub(r"Cali\s*TV", "INTERFREE TV PRO", updated, flags=re.IGNORECASE)
                      updated = re.sub(r"red4tv", "INTERFREE TV PRO", updated, flags=re.IGNORECASE)
                      if updated != content:
                          file.write_text(updated, encoding="utf-8")
                  except UnicodeDecodeError:
                      pass

          # 3. Reemplazos de paquete, permiso y marca en XML y recursos
          xml_targets = [root / "AndroidManifest.xml"] + list((root / "res").rglob("*.xml"))
          for file in xml_targets:
              if not file.is_file():
                  continue
              content = file.read_text(encoding="utf-8", errors="ignore")
              updated = content.replace("com.apps.red4tv", "com.interfree.tvpro")
              updated = updated.replace(
                  "com.apps.amigostv.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSIONbpwsck",
                  "com.interfree.tvpro.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION",
              )
              updated = re.sub(r"Bienvenido a Cali(\s*TV)?", "", updated, flags=re.IGNORECASE)
              updated = re.sub(r"red4tv", "INTERFREE TV PRO", updated, flags=re.IGNORECASE)
              updated = re.sub(r"cali\s*tv", "INTERFREE TV PRO", updated, flags=re.IGNORECASE)
              if updated != content:
                  file.write_text(updated, encoding="utf-8")

          # 4. Ocultar el TextView debajo del logo derecho y equilibrar el margen del recuadro
          sub_xml = root / "res" / "layout" / "fragment_subscription.xml"
          if sub_xml.exists():
              s_xml = sub_xml.read_text(encoding="utf-8")
              s_xml = s_xml.replace(
                  'android:id="@id/linearLayout"',
                  'android:id="@id/linearLayout" android:paddingBottom="@dimen/_10sdp"',
              )
              s_xml = s_xml.replace(
                  'android:id="@id/str_scan_code"',
                  'android:id="@id/str_scan_code" android:visibility="gone"',
              )
              sub_xml.write_text(s_xml, encoding="utf-8")

          # 5. Forzar etiqueta principal en AndroidManifest.xml y strings.xml
          manifest = root / "AndroidManifest.xml"
          m_text = manifest.read_text(encoding="utf-8")
          m_text = re.sub(
              r'(<application\b[^>]*?\bandroid:label=")[^"]*(")',
              r'\1INTERFREE TV PRO\2',
              m_text,
              count=1,
              flags=re.DOTALL,
          )
          manifest.write_text(m_text, encoding="utf-8")

          for s_file in (root / "res").rglob("strings.xml"):
              s_text = s_file.read_text(encoding="utf-8")
              s_new = re.sub(
                  r'(<string name="app_name">)[^<]*(</string>)',
                  r'\1INTERFREE TV PRO\2',
                  s_text,
              )
              if s_new != s_text:
                  s_file.write_text(s_new, encoding="utf-8")
          PY

      - name: Instalar logos (externo, interno y tarjeta derecha) y generar intro.mp4
        run: |
          python3 -m pip install --break-system-packages Pillow
          command -v ffmpeg >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python3 - <<'PY'
          import re
          from PIL import Image
          from pathlib import Path

          png_files = sorted(Path(".").glob("*.png"))
          if not png_files:
              raise FileNotFoundError("No se encontro ningun archivo .png en el repositorio")

          logo = Image.open(png_files[0]).convert("RGBA")
          root = Path("decoded")
          manifest_text = (root / "AndroidManifest.xml").read_text(encoding="utf-8")

          target_stems = {
              "ic_launcher",
              "ic_launcher_round",
              "launcher_icon",
              "app_icon",
              "banner",
              "trans_logo",
              "trans_logo_alt",
              "promos",
              "image_qrcode",
          }

          for match in re.finditer(r'android:(?:icon|roundIcon|banner)="@(?:mipmap|drawable)/([^"]+)"', manifest_text):
              target_stems.add(match.group(1))

          for xml_file in (root / "res").rglob("*.xml"):
              if xml_file.stem in target_stems:
                  x_text = xml_file.read_text(encoding="utf-8", errors="ignore")
                  for fg in re.finditer(r'android:foreground="@(?:mipmap|drawable)/([^"]+)"', x_text):
                      target_stems.add(fg.group(1))

          def fit_on_canvas(logo_rgba: Image.Image, target_size: tuple[int, int]) -> Image.Image:
              tw, th = target_size
              if abs(tw - th) <= 4:
                  return logo_rgba.resize((tw, th), Image.Resampling.LANCZOS)
              max_w = max(1, int(tw * 0.85))
              max_h = max(1, int(th * 0.85))
              lw, lh = logo_rgba.size
              scale = min(max_w / lw, max_h / lh)
              new_w = max(1, int(lw * scale))
              new_h = max(1, int(lh * scale))
              resized = logo_rgba.resize((new_w, new_h), Image.Resampling.LANCZOS)
              canvas = Image.new("RGBA", (tw, th), (0, 0, 0, 0))
              canvas.paste(resized, ((tw - new_w) // 2, (th - new_h) // 2), resized)
              return canvas

          for file in sorted((root / "res").rglob("*")):
              if not file.is_file() or file.suffix.lower() not in (".png", ".webp"):
                  continue
              if file.stem not in target_stems:
                  continue
              with Image.open(file) as original:
                  size = original.size
              out_img = fit_on_canvas(logo, size)
              out_img.save(file)

          intro_bg = Image.new("RGBA", (1280, 720), (10, 10, 16, 255))
          lw, lh = logo.size
          scale = min(420 / lw, 420 / lh)
          nw, nh = int(lw * scale), int(lh * scale)
          logo_intro = logo.resize((nw, nh), Image.Resampling.LANCZOS)
          intro_bg.paste(logo_intro, ((1280 - nw) // 2, (720 - nh) // 2), logo_intro)
          intro_bg.convert("RGB").save("intro_frame.png")

          yml_path = root / "apktool.yml"
          if yml_path.exists():
              yml = yml_path.read_text(encoding="utf-8")
              if "doNotCompress:" in yml and "- mp4" not in yml:
                  yml = yml.replace("doNotCompress:\n", "doNotCompress:\n- mp4\n", 1)
                  yml_path.write_text(yml, encoding="utf-8")
          PY
          ffmpeg -y -loop 1 -i intro_frame.png -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 \
            -c:v libx264 -t 3 -pix_fmt yuv420p -vf "scale=1280:720" -c:a aac -shortest decoded/assets/intro.mp4

      - name: Recompilar APK
        run: java -jar apktool.jar b decoded -o INTERFREE-TV-PRO-UNALIGNED.apk

      - name: Firmar APK con Uber APK Signer (V3)
        run: java -jar uber-apk-signer.jar -a INTERFREE-TV-PRO-UNALIGNED.apk --allowResign -o ./build_final

      - name: Subir APK final (Artefacto)
        uses: actions/upload-artifact@v4
        with:
          name: INTERFREE-TV-PRO-FINAL
          path: ./build_final/*.apk

      - name: Publicar enlace directo en GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp ./build_final/*.apk ./INTERFREE-TV-PRO.apk
          if gh release view v1.0 >/dev/null 2>&1; then
            gh release upload v1.0 ./INTERFREE-TV-PRO.apk --clobber
          else
            gh release create v1.0 ./INTERFREE-TV-PRO.apk \
              --title "INTERFREE TV PRO v1.0" \
              --notes "Instalador oficial INTERFREE TV PRO"
          fi
