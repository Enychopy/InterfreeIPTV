name: Diagnosticar INTERFREE TV PRO

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recuperar workflow anterior y archivos de logo
        run: |
          echo "=== ARCHIVOS EN EL REPOSITORIO ==="
          find . -maxdepth 4 -not -path '*/.*' | sort
          echo ""
          echo "=== HISTORIAL DE build-interfree-pro.yml ==="
          git log -n 5 --oneline -- .github/workflows/build-interfree-pro.yml
          echo ""
          echo "=== CONTENIDO DEL WORKFLOW ANTERIOR ==="
          git show HEAD~1:.github/workflows/build-interfree-pro.yml || git show HEAD~2:.github/workflows/build-interfree-pro.yml || true
