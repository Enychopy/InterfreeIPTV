
name: Build FAMILY TV APK (Rebrand)

on:
  push:
    branches:
      - family-tv
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_PACKAGE: com.familytv.player
  TARGET_APP_NAME: "FAMILY TV"
  TARGET_SERVER: "http://ultratv-lat.online:80"
  APKTOOL_VERSION: "2.11.1"
  BASE_RELEASE_TAG: "v1.0"
  BASE_APK_ASSET: "INTERFREE-TV-PRO.apk"
  PAYLOAD_ZIP: "familytv_rebrand_payload.zip"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 1. Checkout rama family-tv
        uses: actions/checkout@v4
        with:
          ref: family-tv

      - name: 2. Validar payload
        run: |
          set -euo pipefail
          test -f "$PAYLOAD_ZIP"
          unzip -l "$PAYLOAD_ZIP"

      - name: 3. Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 4. Instalar dependencias
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pip pillow
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          test -n "$BUILD_TOOLS_DIR"
          echo "BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR" >> "$GITHUB_ENV"
          echo "$BUILD_TOOLS_DIR" >> "$GITHUB_PATH"

      - name: 5. Descargar APK base y Apktool
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$BASE_RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "$BASE_APK_ASSET" \
            --output base.apk

          curl -fL "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar" \
            -o apktool.jar

          ls -lh base.apk apktool.jar

      - name: 6. Decompilar APK
        run: |
          set -euo pipefail
          java -Xmx2048m -jar apktool.jar d -f base.apk -o decoded
          ls -la decoded/

      - name: 7. Diagnosticar APK original
        run: |
          set -euo pipefail
          {
            echo "DIAGNOSTICO FAMILY TV"
            echo "PACKAGE Y MANIFEST:"
            head -n 30 decoded/AndroidManifest.xml

            echo "LAYOUTS:"
            grep -rnE "logo|splash|login|banner|brand" decoded/res/layout* 2>/dev/null || true

            echo "ARCHIVOS GRAFICOS:"
            find decoded/res decoded/assets -type f \( -iname "*logo*" -o -iname "*banner*" -o -iname "*splash*" -o -iname "*ic_launcher*" \) 2>/dev/null | sort || true

            echo "STRINGS Y URL:"
            grep -rnE "app_name|http://|https://|interfree|liontv|player_api" decoded/res/values* 2>/dev/null || true

            echo "ENDPOINTS XTREAM:"
            grep -rnE "player_api\.php|get\.php|xmltv\.php" decoded/smali* 2>/dev/null | head -n 60 || true

            echo "URL EN SMALI:"
            grep -rnEo "https?://[a-zA-Z0-9._:-]+(/[a-zA-Z0-9._~:/?#@!$&'()*+,;=-]*)?" decoded/smali* 2>/dev/null | head -n 80 || true

            echo "VIDEO INTRO ORIGINAL:"
            find decoded -name "intro.mp4" -exec ls -lh {} \;
          } | tee diagnose-report.txt

      - name: 8. Aplicar assets FAMILY TV
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import shutil
          import zipfile
          from pathlib import Path
          from PIL import Image

          payload_zip = Path(os.environ["PAYLOAD_ZIP"])
          extract_root = Path("payload_raw")
          if extract_root.exists():
              shutil.rmtree(extract_root)
          extract_root.mkdir(parents=True)

          with zipfile.ZipFile(payload_zip, "r") as zf:
              zf.extractall(extract_root)

          entries = [p for p in extract_root.iterdir() if p.name != "__MACOSX"]
          if len(entries) == 1 and entries[0].is_dir() and not (extract_root / "res").exists():
              payload_dir = entries[0]
          else:
              payload_dir = extract_root

          candidate_logos = []
          for p in payload_dir.rglob("*"):
              if p.is_file() and p.suffix.lower() in {".png", ".webp", ".jpg", ".jpeg"}:
                  score = p.stat().st_size
                  if "xhdpi" in str(p):
                      score += 500000
                  if "logo" in p.name.lower():
                      score += 200000
                  candidate_logos.append((score, p))

          if not candidate_logos:
              raise RuntimeError("No se encontraron imagenes en el payload")

          candidate_logos.sort(key=lambda x: x[0], reverse=True)
          master_logo_path = candidate_logos[0][1]

          def write_image(src_path, dst_path):
              dst_path.parent.mkdir(parents=True, exist_ok=True)
              ext = dst_path.suffix.lower()
              with Image.open(src_path) as im:
                  im = im.convert("RGBA")
                  if ext == ".webp":
                      im.save(dst_path, format="WEBP", lossless=True)
                  elif ext in {".jpg", ".jpeg"}:
                      bg = Image.new("RGB", im.size, (10, 20, 45))
                      bg.paste(im, mask=im.split()[3])
                      bg.save(dst_path, format="JPEG", quality=95)
                  else:
                      im.save(dst_path, format="PNG")

          decoded_res = Path("decoded/res")
          payload_res = payload_dir / "res"
          replaced_count = 0

          if payload_res.exists():
              for src_file in payload_res.rglob("*"):
                  if not src_file.is_file() or src_file.suffix.lower() not in {".png", ".webp"}:
                      continue

                  rel_folder = src_file.parent.name
                  stem = src_file.stem
                  matching_dirs = [
                      d for d in decoded_res.iterdir()
                      if d.is_dir() and (d.name == rel_folder or d.name.startswith(rel_folder + "-v"))
                  ]

                  if not matching_dirs:
                      matching_dirs = [decoded_res / rel_folder]

                  for target_dir in matching_dirs:
                      existing_targets = list(target_dir.glob(f"{stem}.*"))
                      if existing_targets:
                          for existing in existing_targets:
                              if existing.suffix.lower() in {".png", ".webp"}:
                                  write_image(src_file, existing)
                                  replaced_count += 1
                      else:
                          write_image(src_file, target_dir / src_file.name)
                          replaced_count += 1

          target_keywords = (
              "trans_logo", "app_logo", "splash_logo",
              "ic_logo", "logo", "ic_launcher", "banner"
          )

          for base_folder in [Path("decoded/res"), Path("decoded/assets")]:
              if not base_folder.exists():
                  continue

              for existing in base_folder.rglob("*"):
                  if not existing.is_file() or existing.suffix.lower() not in {".png", ".webp"}:
                      continue

                  name_low = existing.stem.lower()
                  if name_low.startswith(("exo_", "abc_", "notification_", "googleg_")):
                      continue

                  if any(k == name_low or name_low.startswith(k) or name_low.endswith(k) for k in target_keywords):
                      folder_clean = existing.parent.name.split("-v")[0]
                      specific = payload_res / folder_clean / f"{existing.stem}.png"
                      src_to_use = specific if specific.exists() else master_logo_path
                      write_image(src_to_use, existing)
                      replaced_count += 1

          print(f"Graficos actualizados: {replaced_count}")
          if replaced_count == 0:
              raise RuntimeError("No se reemplazo ningun asset grafico")
          PY

      - name: 9. Aplicar marca, package y servidor
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          target_pkg = os.environ["TARGET_PACKAGE"]
          target_name = os.environ["TARGET_APP_NAME"]
          target_server = os.environ["TARGET_SERVER"].rstrip("/")

          xml_dir = Path("decoded/res/xml")
          xml_dir.mkdir(parents=True, exist_ok=True)

          nsc_path = xml_dir / "network_security_config.xml"
          nsc_path.write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<network-security-config>\n'
              '    <base-config cleartextTrafficPermitted="true">\n'
              '        <trust-anchors>\n'
              '            <certificates src="system" />\n'
              '        </trust-anchors>\n'
              '    </base-config>\n'
              '    <domain-config cleartextTrafficPermitted="true">\n'
              '        <domain includeSubdomains="true">ultratv-lat.online</domain>\n'
              '    </domain-config>\n'
              '</network-security-config>\n',
              encoding="utf-8"
          )

          manifest_path = Path("decoded/AndroidManifest.xml")
          ANDROID_NS = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", ANDROID_NS)

          tree = ET.parse(manifest_path)
          root = tree.getroot()
          old_pkg = root.attrib.get("package", "").strip()

          if not old_pkg:
              raise RuntimeError("No se pudo leer el package original")

          print(f"Package original: {old_pkg} -> {target_pkg}")
          root.attrib["package"] = target_pkg

          app_el = root.find("application")
          if app_el is None:
              raise RuntimeError("No se encontro application")

          app_el.attrib[f"{{{ANDROID_NS}}}usesCleartextTraffic"] = "true"
          app_el.attrib[f"{{{ANDROID_NS}}}networkSecurityConfig"] = "@xml/network_security_config"

          for elem in app_el.iter():
              name_attr = elem.attrib.get(f"{{{ANDROID_NS}}}name")
              if name_attr and name_attr.startswith("."):
                  elem.attrib[f"{{{ANDROID_NS}}}name"] = old_pkg + name_attr

              auth_attr = elem.attrib.get(f"{{{ANDROID_NS}}}authorities")
              if auth_attr and old_pkg in auth_attr:
                  elem.attrib[f"{{{ANDROID_NS}}}authorities"] = auth_attr.replace(old_pkg, target_pkg)

          tree.write(manifest_path, encoding="utf-8", xml_declaration=True)

          yml_path = Path("decoded/apktool.yml")
          yml_text = yml_path.read_text(encoding="utf-8")

          if "renameManifestPackage:" in yml_text:
              yml_text = re.sub(
                  r"renameManifestPackage:\s*.*",
                  f"renameManifestPackage: {target_pkg}",
                  yml_text
              )
          else:
              yml_text += f"\npackageInfo:\n  forcedPackageId: '127'\n  renameManifestPackage: {target_pkg}\n"

          yml_path.write_text(yml_text, encoding="utf-8")

          for strings_file in Path("decoded/res").rglob("strings.xml"):
              txt = strings_file.read_text(encoding="utf-8", errors="ignore")
              txt = re.sub(r"INTERFREE\s*TV\s*PRO", target_name, txt, flags=re.IGNORECASE)
              txt = re.sub(r"INTERFREE\s*TV", target_name, txt, flags=re.IGNORECASE)
              txt = re.sub(r"INTERFREE", "FAMILY", txt, flags=re.IGNORECASE)
              strings_file.write_text(txt, encoding="utf-8")

          excluded_hosts = (
              "schemas.android.com", "www.w3.org", "w3.org",
              "xmlpull.org", "apache.org", "www.apache.org",
              "googleapis.com", "google.com", "gstatic.com",
              "googleusercontent.com", "facebook.com", "fbcdn.net",
              "exoplayer.dev", "themoviedb.org", "tmdb.org",
              "github.com", "ultratv-lat.online"
          )

          url_pattern = re.compile(r"https?://([a-zA-Z0-9.-]+)(?::\d+)?")

          def replace_portal_url(match):
              full = match.group(0)
              host = match.group(1).lower()
              if any(host == ex or host.endswith("." + ex) for ex in excluded_hosts):
                  return full
              print(f"URL reemplazada: {full} -> {target_server}")
              return target_server

          target_extensions = {".smali", ".xml", ".json", ".js", ".properties", ".txt"}
          url_replacements = 0

          for root_dir in [
              Path("decoded/smali"),
              Path("decoded/smali_classes2"),
              Path("decoded/smali_classes3"),
              Path("decoded/smali_classes4"),
              Path("decoded/res"),
              Path("decoded/assets")
          ]:
              if not root_dir.exists():
                  continue

              for fpath in root_dir.rglob("*"):
                  if not fpath.is_file() or fpath.suffix.lower() not in target_extensions:
                      continue
                  if fpath.name == "network_security_config.xml":
                      continue

                  content = fpath.read_text(encoding="utf-8", errors="ignore")
                  new_content, count = url_pattern.subn(replace_portal_url, content)

                  if count:
                      fpath.write_text(new_content, encoding="utf-8")
                      url_replacements += count

          print(f"URLs reemplazadas: {url_replacements}")
          PY

      - name: 10. Sustituir video intro por el pequeño
        run: |
          set -euo pipefail

          SMALL_VIDEO="decoded/assets/intro.mp4"

          if [ ! -f "$SMALL_VIDEO" ]; then
            echo "::error::No existe decoded/assets/intro.mp4"
            exit 1
          fi

          SMALL_SIZE=$(stat -c%s "$SMALL_VIDEO")
          if [ "$SMALL_SIZE" -ge 500000 ]; then
            echo "::error::El video de assets no es el video pequeño"
            exit 1
          fi

          find decoded -type f -name "intro.mp4" -print

          while IFS= read -r VIDEO; do
            if [ "$VIDEO" != "$SMALL_VIDEO" ]; then
              cp "$SMALL_VIDEO" "$VIDEO"
            fi
          done < <(find decoded -type f -name "intro.mp4")

          echo "Videos intro después del reemplazo:"
          find decoded -type f -name "intro.mp4" -exec ls -lh {} \;

          while IFS= read -r VIDEO; do
            cmp "$SMALL_VIDEO" "$VIDEO"
          done < <(find decoded -type f -name "intro.mp4")

      - name: 11. Reconstruir APK
        run: |
          set -euo pipefail
          java -Xmx2048m -jar apktool.jar b decoded -o FAMILY-TV-unsigned.apk
          ls -lh FAMILY-TV-unsigned.apk

      - name: 12. Verificar video y manifiesto reconstruidos
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          apk = Path("FAMILY-TV-unsigned.apk")
          with zipfile.ZipFile(apk) as z:
              videos = [
                  (name, info.file_size)
                  for name, info in ((i.filename, i) for i in z.infolist())
                  if name.endswith("intro.mp4")
              ]

              print("Videos dentro del APK:")
              for name, size in videos:
                  print(f"{name}: {size} bytes")

              if not videos:
                  raise SystemExit("ERROR: No se encontro intro.mp4")

              if any(size >= 500000 for _, size in videos):
                  raise SystemExit("ERROR: Todavia existe un video intro grande")
          PY

          echo "=== MANIFIESTO / PACKAGE / SDK ==="
          aapt dump badging FAMILY-TV-unsigned.apk | head -n 20

      - name: 13. Alinear, firmar y verificar APK
        run: |
          set -euo pipefail

          keytool -genkeypair -v \
            -keystore familytv.jks \
            -alias familytv \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass familytv123 \
            -keypass familytv123 \
            -dname "CN=FAMILY TV, OU=IPTV, O=FAMILY TV, L=San Salvador, ST=SS, C=SV"

          zipalign -f -p 4 FAMILY-TV-unsigned.apk FAMILY-TV-aligned.apk

          apksigner sign \
            --ks familytv.jks \
            --ks-key-alias familytv \
            --ks-pass pass:familytv123 \
            --key-pass pass:familytv123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out FAMILY-TV.apk \
            FAMILY-TV-aligned.apk

          apksigner verify --verbose FAMILY-TV.apk

          echo "=== BADGING APK FINAL ==="
          aapt dump badging FAMILY-TV.apk | head -n 20

      - name: 14. Subir reporte de diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-tv-diagnose-report
          path: diagnose-report.txt
          if-no-files-found: warn

      - name: 15. Subir APK final FAMILY TV
        uses: actions/upload-artifact@v4
        with:
          name: FAMILY-TV-APK
          path: FAMILY-TV.apk
          if-no-files-found: error
