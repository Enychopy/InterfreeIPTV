
name: Build FAMILY TV - Independent IBO Player

on:
  workflow_dispatch:
  push:
    branches:
      - family-tv
    paths:
      - '.github/workflows/build-family-tv-ibo.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout family-tv
        uses: actions/checkout@v4
        with:
          ref: family-tv

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android tools
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -n "$BUILD_TOOLS"
          echo "$BUILD_TOOLS" >> "$GITHUB_PATH"
          echo "Using $BUILD_TOOLS"

      - name: Download FAMILY TV source
        run: |
          curl -fL --retry 3 \
            "https://github.com/Enychopy/InterfreeIPTV/releases/download/family-tv-source-v1/FAMILY_TV_IBO_PLAYER_rebranded_source.zip" \
            -o family-tv-source.zip

          unzip -q family-tv-source.zip -d source

          test -f source/ibo-decoded/apktool.yml
          test -f source/ibo-decoded/AndroidManifest.xml

      - name: Set independent application ID
        run: |
          MANIFEST="source/ibo-decoded/AndroidManifest.xml"

          sed -i 's/com.apps.red4tv/com.familytv.player/g' "$MANIFEST"

          grep -q 'package="com.familytv.player"' "$MANIFEST"
          grep -q 'com.familytv.player.provider' "$MANIFEST"
          grep -q 'com.familytv.player.firebaseinitprovider' "$MANIFEST"
          grep -q 'com.familytv.player.androidx-startup' "$MANIFEST"

          echo "Independent package configured successfully"

      - name: Download Apktool
        run: |
          curl -fL --retry 3 \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar" \
            -o apktool.jar

      - name: Rebuild IBO Player
        run: |
          java -jar apktool.jar b source/ibo-decoded \
            -o FAMILY_TV-unsigned.apk

      - name: Generate signing key
        run: |
          keytool -genkeypair -v \
            -keystore family-tv.jks \
            -storepass familytv123 \
            -keypass familytv123 \
            -alias familytv \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=FAMILY TV, OU=Apps, O=FAMILY TV, L=San Salvador, ST=San Salvador, C=SV"

      - name: Align and sign APK
        run: |
          zipalign -p -f 4 FAMILY_TV-unsigned.apk FAMILY_TV-aligned.apk

          apksigner sign \
            --ks family-tv.jks \
            --ks-key-alias familytv \
            --ks-pass pass:familytv123 \
            --key-pass pass:familytv123 \
            --out FAMILY_TV.apk \
            FAMILY_TV-aligned.apk

          apksigner verify --verbose FAMILY_TV.apk

      - name: Verify independent package
        run: |
          aapt dump badging FAMILY_TV.apk | grep "package: name='com.familytv.player'"

      - name: Upload FAMILY TV APK
        uses: actions/upload-artifact@v4
        with:
          name: FAMILY-TV-INDEPENDENT-APK
          path: FAMILY_TV.apk
          if-no-files-found: error
