name: Build FAMILY TV

on:
  workflow_dispatch:
  push:
    branches:
      - family-tv
    paths:
      - '.github/workflows/build-family-tv-ibo.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: family-tv

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android tools
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -n "$BUILD_TOOLS"
          echo "$BUILD_TOOLS" >> "$GITHUB_PATH"

      - name: Download INTERFREE TV PRO base
        run: |
          curl -fL --retry 3 \
            "https://github.com/Enychopy/InterfreeIPTV/releases/download/v1.0/INTERFREE-TV-PRO.apk" \
            -o base.apk
          test -s base.apk
          ls -lh base.apk

      - name: Download Apktool
        run: |
          curl -fL --retry 3 \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar" \
            -o apktool.jar

      - name: Decode APK
        run: |
          java -jar apktool.jar d -f base.apk -o decoded

      - name: Diagnose real branding and server
        run: |
          echo "=== Layouts que usan logo ==="
          grep -R "ImageView\|@drawable" decoded/res/layout/ | grep -i -E "logo|trans|splash|banner" || true
          echo ""
          echo "=== Todos los PNGs con marca ==="
          find decoded/res -name "*.png" | grep -i -E "logo|banner|trans|splash|sp_bg|ic_launcher" | sort
          echo ""
          echo "=== Strings con http ==="
          grep -R "http" decoded/res/values/ --include="*.xml" -n | head -n 50 || true
          echo ""
          echo "=== Smali con player_api / get.php / http ==="
          grep -R -n "player_api\|get.php\|http" decoded/smali* --include="*.smali" | head -n 100 || true
          echo ""
          echo "=== Posible URL en .so ==="
          strings decoded/lib/*/*.so 2>/dev/null | grep -E "http|ultratv" | head -n 20 || true

      - name: Apply FAMILY TV graphic assets MULTI-DENSITY
        run: |
          test -s familytv_rebrand_payload.zip
          unzip -t familytv_rebrand_payload.zip
          rm -rf /tmp/familytv
          unzip -o familytv_rebrand_payload.zip -d /tmp/familytv

          LOGO_SRC=""
          for cand in "/tmp/familytv/res/drawable-xxxhdpi/trans_logo.png" "/tmp/familytv/res/drawable/trans_logo.png" "/tmp/familytv/trans_logo.png" "/tmp/familytv/logo.png" "/tmp/familytv/res/mipmap-xxxhdpi/ic_launcher.png"; do
            if [ -f "$cand" ]; then LOGO_SRC="$cand"; break; fi
          done
          if [ -z "$LOGO_SRC" ]; then
            LOGO_SRC=$(find /tmp/familytv -name "*.png" | head -n 1)
          fi
          echo "Logo fuente detectado: $LOGO_SRC"
          test -n "$LOGO_SRC"

          find decoded/res -type d -name "drawable*" | while read d; do
            cp -f "$LOGO_SRC" "$d/trans_logo.png" 2>/dev/null || true
            cp -f "$LOGO_SRC" "$d/trans_logo_alt.png" 2>/dev/null || true
            cp -f "$LOGO_SRC" "$d/logo.png" 2>/dev/null || true
            cp -f "$LOGO_SRC" "$d/ic_logo.png" 2>/dev/null || true
            cp -f "$LOGO_SRC" "$d/app_logo.png" 2>/dev/null || true
            cp -f "$LOGO_SRC" "$d/splash_logo.png" 2>/dev/null || true
          done

          BANNER_SRC=$(find /tmp/familytv -name "banner.png" | head -n 1)
          if [ -n "$BANNER_SRC" ]; then
            find decoded/res -type d -name "drawable*" | while read d; do
              cp -f "$BANNER_SRC" "$d/banner.png" 2>/dev/null || true
            done
          fi

          ICON_SRC=$(find /tmp/familytv -name "ic_launcher.png" | head -n 1)
          if [ -n "$ICON_SRC" ]; then
            find decoded/res -type d -name "mipmap*" | while read d; do
              cp -f "$ICON_SRC" "$d/ic_launcher.png" 2>/dev/null || true
              cp -f "$ICON_SRC" "$d/ic_launcher_round.png" 2>/dev/null || true
              cp -f "$ICON_SRC" "$d/ic_launcher_foreground.png" 2>/dev/null || true
            done
          fi

          find decoded/assets -name "*.png" 2>/dev/null | while read a; do
            cp -f "$LOGO_SRC" "$a" 2>/dev/null || true
          done || true

          echo "Recursos FAMILY TV aplicados en todas las densidades"

      - name: Rebrand FAMILY TV - URL generica ultratv-lat.online
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          root = Path("decoded")
          NEW_HOST = "ultratv-lat.online:80"
          NEW_URL = f"http://{NEW_HOST}"
          url_pattern = re.compile(r'https?://[a-zA-Z0-9\.\-_:]+(?::\d+)?')

          count = 0
          for p in root.rglob("*"):
              if not p.is_file(): continue
              if p.suffix in (".png", ".jpg", ".jpeg", ".webp", ".so", ".dex", ".arsc", ".mp3", ".wav"): continue
              try:
                  text = p.read_text(encoding="utf-8")
              except:
                  continue
              orig = text
              text = text.replace("com.interfree.tvpro", "com.familytv.player")
              text = text.replace("com.interfree", "com.familytv")
              text = text.replace("INTERFREE TV PRO", "FAMILY TV")
              text = text.replace("INTERFREE-TV-PRO", "FAMILY-TV")
              text = text.replace("INTERFREE TV", "FAMILY TV")
              text = text.replace("INTERFREE", "FAMILY")

              lower_path = str(p).lower()
              is_candidate = (
                  "smali" in lower_path or "config" in lower_path or "constant" in lower_path or
                  "api" in lower_path or "server" in lower_path or "url" in lower_path or
                  "values" in lower_path or "strings" in lower_path or
                  "player_api" in text or "get.php" in text
              )

              if is_candidate and "http" in text:
                  def replace_url_match(m):
                      url = m.group(0)
                      if any(x in url for x in ["google", "facebook", "android", "gstatic"]):
                          return url
                      return NEW_URL
                  text = url_pattern.sub
