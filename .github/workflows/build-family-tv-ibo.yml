
name: Build FAMILY TV

on:
  workflow_dispatch:
  push:
    branches:
      - family-tv
    paths:
      - '.github/workflows/build-family-tv-ibo.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: family-tv

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android tools
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -n "$BUILD_TOOLS"
          echo "$BUILD_TOOLS" >> "$GITHUB_PATH"

      - name: Download INTERFREE TV PRO
        run: |
          curl -fL --retry 3 \
            "https://github.com/Enychopy/InterfreeIPTV/releases/download/v1.0/INTERFREE-TV-PRO.apk" \
            -o base.apk
          test -s base.apk

      - name: Download Apktool
        run: |
          curl -fL --retry 3 \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar" \
            -o apktool.jar

      - name: Decode APK
        run: |
          java -jar apktool.jar d -f base.apk -o decoded

      - name: Rebrand FAMILY TV
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("decoded")

          replacements = {
              "com.interfree.tvpro": "com.familytv.player",
              "INTERFREE TV PRO": "FAMILY TV",
              "INTERFREE-TV-PRO": "FAMILY-TV",
              "INTERFREE TV": "FAMILY TV",
              "http://liontv.es:8080": "http://ultratv-lat.online:80",
              "https://liontv.es:8080": "http://ultratv-lat.online:80",
              "liontv.es:8080": "ultratv-lat.online:80"
          }

          count = 0

          for file in root.rglob("*"):
              if not file.is_file():
                  continue
              try:
                  original = file.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              updated = original
              for old, new in replacements.items():
                  updated = updated.replace(old, new)

              if updated != original:
                  file.write_text(updated, encoding="utf-8")
                  count += 1

          manifest = root / "AndroidManifest.xml"
          content = manifest.read_text(encoding="utf-8")

          if 'package="com.familytv.player"' not in content:
              raise SystemExit("ERROR: package FAMILY TV no configurado")

          if "com.interfree.tvpro" in content:
              raise SystemExit("ERROR: quedan referencias al paquete anterior")

          print("Archivos modificados:", count)
          PY

      - name: Build APK
        run: |
          java -jar apktool.jar b decoded -o FAMILY-TV-unsigned.apk
          test -s FAMILY-TV-unsigned.apk

      - name: Sign APK
        run: |
          keytool -genkeypair -v \
            -keystore family-tv.jks \
            -storepass familytv123 \
            -keypass familytv123 \
            -alias familytv \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=FAMILY TV, OU=Apps, O=FAMILY TV, L=San Salvador, ST=San Salvador, C=SV"

          zipalign -p -f 4 FAMILY-TV-unsigned.apk FAMILY-TV-aligned.apk

          apksigner sign \
            --ks family-tv.jks \
            --ks-key-alias familytv \
            --ks-pass pass:familytv123 \
            --key-pass pass:familytv123 \
            --out FAMILY-TV.apk \
            FAMILY-TV-aligned.apk

          apksigner verify --verbose FAMILY-TV.apk

          aapt dump badging FAMILY-TV.apk | grep "package: name='com.familytv.player'"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FAMILY-TV-APK
          path: FAMILY-TV.apk
          if-no-files-found: error
