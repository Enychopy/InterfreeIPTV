
name: Construir INTERFREE TV 1.5

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Instalar Android SDK 34
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extraer INTERFREE TV 1.5 corregido
        shell: bash
        run: |
          set -euo pipefail

          ZIP="INTERFREE_TV_1.5_etapa4_logo_rojo_corregido.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: No existe $ZIP en la raiz del repositorio."
            exit 1
          fi

          mkdir proyecto15
          unzip -q "$ZIP" -d proyecto15

          PROJECT="proyecto15/InterfreeTV"

          test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/app/build.gradle.kts"
          test -f "$PROJECT/app/src/main/java/com/interfree/tv/MainActivity.kt"
          test -f "$PROJECT/app/src/main/java/com/interfree/tv/Data.kt"

          grep -q 'versionName = "1.5"' "$PROJECT/app/build.gradle.kts"

          echo "Proyecto confirmado: INTERFREE TV 1.5 - LOGO ROJO"
          echo "ZIP utilizado: $ZIP"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          gradle -p "$PROJECT" --no-daemon :app:assembleDebug

      - name: Verificar APK
        run: |
          test -f "$PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: INTERFREE-TV-1.5-LOGO-ROJO
          path: proyecto15/InterfreeTV/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
