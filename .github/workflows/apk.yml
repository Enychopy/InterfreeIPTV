
name: Construir INTERFREE TV 1.5

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extraer proyecto con logo rojo
        shell: bash
        run: |
          set -euo pipefail

          ZIP="INTERFREE_TV_1.5_etapa4_logo_rojo_corregido.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: No se encuentra el ZIP: $ZIP"
            exit 1
          fi

          mkdir -p proyecto15
          unzip -q "$ZIP" -d proyecto15

          PROJECT="proyecto15/InterfreeTV"

          if [ ! -f "$PROJECT/settings.gradle.kts" ]; then
            echo "ERROR: No se encontró settings.gradle.kts"
            echo "Contenido extraído:"
            find proyecto15 -maxdepth 3 -type f | head -80
            exit 1
          fi

          if [ ! -f "$PROJECT/app/build.gradle.kts" ]; then
            echo "ERROR: No se encontró app/build.gradle.kts"
            exit 1
          fi

          echo "Proyecto encontrado correctamente."
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          gradle -p "$PROJECT" --no-daemon assembleDebug

      - name: Verificar APK
        run: |
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: INTERFREE-TV-1.5-LOGO-ROJO
          path: proyecto15/InterfreeTV/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
