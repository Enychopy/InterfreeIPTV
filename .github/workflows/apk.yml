name: Construir APK INTERFREE TV

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto visual
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="./InterfreeTV_catalogo_visual.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: No se encuentra $ZIP_FILE en la raíz del repositorio."
            echo "Archivos disponibles:"
            ls -la
            exit 1
          fi
          mkdir -p ./proyecto_extraido
          unzip -q "$ZIP_FILE" -d ./proyecto_extraido
          PROJECT_FILE="$(find ./proyecto_extraido -type f -name settings.gradle.kts -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: No se encontró settings.gradle.kts dentro del ZIP."
            find ./proyecto_extraido -maxdepth 4 -type f | head -80
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "Proyecto encontrado en: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Aceptar licencias del SDK
        shell: bash
        run: yes | sdkmanager --licenses || true

      - name: Construir APK
        shell: bash
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug --stacktrace

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: INTERFREE-TV-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Crear release de prueba
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          TAG="v1.4-build${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$APK_PATH" \
            --title "INTERFREE TV 1.4 (build ${GITHUB_RUN_NUMBER})" \
            --notes "APK de prueba generado automáticamente por GitHub Actions."
