name: Construir APK INTERFREE TV

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Localizar y descomprimir el proyecto Android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proyecto_extraido

          ZIP_FILE=""
          while IFS= read -r candidate; do
            if unzip -Z1 "$candidate" | grep -qE '(^|/)settings\.gradle\.kts$'; then
              ZIP_FILE="$candidate"
              break
            fi
          done < <(find . -maxdepth 1 -type f -iname '*.zip' -print | sort)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró un ZIP con settings.gradle.kts."
            find . -maxdepth 1 -type f -iname '*.zip' -print || true
            exit 1
          fi

          echo "Proyecto ZIP encontrado: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d ./proyecto_extraido

          SETTINGS_FILE="$(find ./proyecto_extraido -type f -name settings.gradle.kts -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: El ZIP no contiene settings.gradle.kts."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto Android ubicado en: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Construir APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" --no-daemon :app:assembleDebug

          APK_PATH="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: No se encontró el APK esperado."
            find "$PROJECT_DIR/app/build/outputs" -maxdepth 5 -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          ls -lh "$APK_PATH"

      - name: Guardar APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: INTERFREE-TV-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Crear release de prueba
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.4-build${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" "$APK_PATH" \
            --title "INTERFREE TV 1.4 (build ${GITHUB_RUN_NUMBER})" \
            --notes "APK de prueba generado automáticamente por GitHub Actions."
