
name: Construir APK INTERFREE TV

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceptar licencias e instalar Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extraer proyecto corregido
        shell: bash
        run: |
          set -e
          ZIP_FILE="InterfreeTV_diseno_nuevo_corregido.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró $ZIP_FILE"
            exit 1
          fi

          mkdir -p proyecto_extraido
          unzip -q "$ZIP_FILE" -d proyecto_extraido

          SETTINGS_FILE=$(find proyecto_extraido -name settings.gradle.kts -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No se encontró settings.gradle.kts"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Proyecto encontrado:"
          ls -la "$PROJECT_DIR"

      - name: Construir APK
        shell: bash
        run: |
          set -e
          gradle -p "$PROJECT_DIR" --no-daemon :app:assembleDebug

      - name: Guardar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: INTERFREE-TV-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
