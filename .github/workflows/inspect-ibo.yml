
name: Inspect IBO Player APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Download original FAMILY TV APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://api.github.com/repos/Enychopy/InterfreeIPTV/releases/tags/ibo-original-v2 -o release.json
          APK_URL="$(jq -r '.assets[] | select(.name == "Red4TV_1.38.apk") | .browser_download_url' release.json)"
          test -n "$APK_URL" && test "$APK_URL" != "null"
          curl -fL "$APK_URL" -o original.apk
          ls -lh original.apk
          sha256sum original.apk > original.sha256

      - name: Install Apktool
        run: |
          curl -fL https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -o apktool.jar
          java -jar apktool.jar --version

      - name: Decompile original APK
        run: |
          java -jar apktool.jar d -f original.apk -o ibo-decoded

      - name: Create inspection ZIP
        run: |
          {
            echo "APK CHECKSUM"
            cat original.sha256
            echo
            echo "APK METADATA"
            grep -E 'versionCode|versionName' ibo-decoded/apktool.yml || true
            echo
            echo "PACKAGE AND COMPONENTS"
            grep -E 'package=|android:name=|android:label=' ibo-decoded/AndroidManifest.xml | head -150 || true
            echo
            echo "LOGO, INTRO AND SPLASH"
            find ibo-decoded/res ibo-decoded/assets -type f 2>/dev/null | grep -Ei 'logo|intro|splash|launcher|icon|\.mp4$' | head -250 || true
          } > inspection.txt
          zip -qr IBO-PLAYER-DECOMPILED.zip ibo-decoded inspection.txt original.sha256

      - name: Upload decoded project
        uses: actions/upload-artifact@v4
        with:
          name: IBO-PLAYER-DECOMPILED
          path: IBO-PLAYER-DECOMPILED.zip
          if-no-files-found: error
          retention-days: 7
