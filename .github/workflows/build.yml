
name: Construir APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          unzip -oq InterfreeTV_diseno_nuevo.zip
          test -d InterfreeTV/app

      - name: Instalar archivos corregidos
        run: |
          APP="InterfreeTV/app/src/main/java/com/interfree/tv"

          # Instalar MainActivity corregido
          test -f MainActivity_corregido.kt
          cp MainActivity_corregido.kt "$APP/MainActivity.kt"

          # Instalar Data.kt corregido
          if [ -f Data_corregido_orden_canales.kt ]; then
            cp Data_corregido_orden_canales.kt "$APP/Data.kt"
          elif [ -f Data.kt ]; then
            cp Data.kt "$APP/Data.kt"
          else
            echo "ERROR: No se encontró el Data.kt corregido"
            exit 1
          fi

          echo "Archivos corregidos instalados:"
          ls -l "$APP/MainActivity.kt" "$APP/Data.kt"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Aceptar licencias Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compilar INTERFREE TV
        shell: bash
        run: |
          gradle -p InterfreeTV assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Preparar APK
        run: |
          cp InterfreeTV/app/build/outputs/apk/debug/app-debug.apk InterfreeTV.apk
          ls -lh InterfreeTV.apk

      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.3-${{ github.run_number }}"
          gh release create "$TAG" InterfreeTV.apk \
            --title "INTERFREE TV ($TAG)" \
            --notes "Nueva compilación de INTERFREE TV"

      - name: Guardar APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: INTERFREE-TV-APK
          path: InterfreeTV.apk

      - name: Guardar registro de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
