
name: Construir APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: unzip -q InterfreeTV_diseno_nuevo.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Aceptar licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Construir
        shell: bash
        run: gradle -p InterfreeTV assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp InterfreeTV/app/build/outputs/apk/debug/app-debug.apk InterfreeTV.apk
          gh release create "v1.3-${{ github.run_number }}" InterfreeTV.apk --title "INTERFREE TV 1.3 (build ${{ github.run_number }})" --notes "APK de prueba"

      - name: Guardar registro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
