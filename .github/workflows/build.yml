
name: Construir APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto optimizado
        run: |
          rm -rf InterfreeTV
          unzip -oq InterfreeTV_optimizado_subtitulos.zip
          test -f InterfreeTV/settings.gradle.kts
          test -f InterfreeTV/app/build.gradle.kts
          test -f InterfreeTV/app/src/main/java/com/interfree/tv/MainActivity.kt
          test -f InterfreeTV/app/src/main/java/com/interfree/tv/Data.kt

      - name: Corregir listener del reproductor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("InterfreeTV/app/src/main/java/com/interfree/tv/MainActivity.kt")
          s = p.read_text()

          pattern = re.compile(
              r"setControllerVisibilityListener\s*\{\s*visibility\s*->\s*menuOpen\s*=\s*visibility\s*==\s*android\.view\.View\.VISIBLE\s*\}",
              re.MULTILINE
          )

          replacement = """setControllerVisibilityListener(
              PlayerView.ControllerVisibilityListener { visibility ->
                  menuOpen = visibility == android.view.View.VISIBLE
              }
          )"""

          s, count = pattern.subn(replacement, s)

          if count != 1:
              raise SystemExit(
                  f"ERROR: Se esperaba corregir 1 listener, pero se encontraron {count}."
              )

          p.write_text(s)
          print("Listener corregido correctamente.")
          PY

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Aceptar licencias Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compilar INTERFREE TV
        shell: bash
        run: |
          gradle -p InterfreeTV assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Preparar APK
        run: |
          cp InterfreeTV/app/build/outputs/apk/debug/app-debug.apk InterfreeTV.apk
          ls -lh InterfreeTV.apk

      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.4-${{ github.run_number }}"
          gh release create "$TAG" InterfreeTV.apk \
            --title "INTERFREE TV ($TAG)" \
            --notes "Nueva compilación optimizada de INTERFREE TV"

      - name: Guardar APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: INTERFREE-TV-APK
          path: InterfreeTV.apk

      - name: Guardar registro de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
