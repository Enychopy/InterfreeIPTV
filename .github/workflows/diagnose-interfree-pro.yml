name: Diagnosticar INTERFREE TV PRO

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recuperar workflow anterior y archivos de logo
        run: |
          echo "=== ARCHIVOS EN EL REPOSITORIO ==="
          find . -maxdepth 4 -not -path '*/.*' | sort
          echo ""
          echo "=== WORKFLOW ANTERIOR DE BUILD ==="
          PREV_COMMIT=$(git log -n 2 --format="%H" -- .github/workflows/build-interfree-pro.yml | tail -n 1)
          git show "$PREV_COMMIT:.github/workflows/build-interfree-pro.yml"
