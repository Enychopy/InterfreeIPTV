name: Diagnosticar INTERFREE TV PRO

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspeccionar workflows y commit a5ef55a
        run: |
          echo "=== WORKFLOWS ACTUALES ==="
          ls -la .github/workflows/
          echo ""
          echo "=== CONTENIDO DE build-interfree-pro.yml EN a5ef55a ==="
          git show a5ef55a:.github/workflows/build-interfree-pro.yml
          echo ""
          echo "=== CONTENIDO DE verify-interfree-pro.yml ==="
          cat .github/workflows/verify-interfree-pro.yml || true
