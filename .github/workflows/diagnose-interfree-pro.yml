name: Diagnosticar INTERFREE TV PRO

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Leer verify-interfree-pro y commit a710a48
        run: |
          echo "=== VERIFY-INTERFREE-PRO.YML ==="
          cat .github/workflows/verify-interfree-pro.yml
          echo ""
          echo "=== BUILD ORIGINAL EN a710a48 ==="
          git show a710a48:.github/workflows/build-interfree-pro.yml
