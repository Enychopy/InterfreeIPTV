name: Diagnosticar INTERFREE TV PRO

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar APK original y Apktool
        run: |
          curl -L --fail -o Red4TVibo.apk https://github.com/Enychopy/InterfreeIPTV/releases/download/ibo-original/Red4TVibo.apk
          curl -L --fail -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          java -jar apktool.jar d -f Red4TVibo.apk -o decoded

      - name: Ver tarjeta derecha de subscription y specs de intro.mp4
        run: |
          echo "=== PROPIEDADES DE intro.mp4 ==="
          ffprobe -hide_banner decoded/assets/intro.mp4 2>&1 || ls -lh decoded/assets/intro.mp4
          echo ""
          echo "=== FRAGMENT_SUBSCRIPTION.XML (LINEAS 20-80) ==="
          sed -n '20,80p' decoded/res/layout/fragment_subscription.xml
          echo ""
          echo "=== SMALI DE SUBSCRIPTION / RTX ==="
          grep -rn "fragment_subscription" decoded/smali* || true
          grep -rn "rtx_splash" decoded/smali* || true
