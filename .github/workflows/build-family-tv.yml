
name: Build FAMILY TV

on:
  push:
    branches:
      - family-tv
    paths:
      - 'FAMILY_TV_base_adaptada.zip'
      - '.github/workflows/build-family-tv.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: family-tv

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Descomprimir proyecto FAMILY TV
        shell: bash
        run: |
          set -euo pipefail
          ZIP="FAMILY_TV_base_adaptada.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: No se encontró $ZIP"
            exit 1
          fi

          mkdir -p unpacked
          unzip -oq "$ZIP" -d unpacked

          SETTINGS=$(find unpacked -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró settings.gradle"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: No se encontró el módulo app"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto localizado: $PROJECT_DIR"

      - name: Compilar FAMILY TV
        shell: bash
        run: |
          set -o pipefail
          gradle -p "$PROJECT_DIR" assembleDebug --no-daemon --stacktrace 2>&1 | tee build-family-tv.log

      - name: Preparar APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: No se encontró el APK generado"
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/FAMILY-TV.apk
          ls -lh output/FAMILY-TV.apk

      - name: Publicar APK FAMILY TV
        uses: actions/upload-artifact@v4
        with:
          name: FAMILY-TV-APK
          path: output/FAMILY-TV.apk
          if-no-files-found: error

      - name: Guardar registro de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FAMILY-TV-build-log
          path: build-family-tv.log
          if-no-files-found: ignore
