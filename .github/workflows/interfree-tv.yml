name: INTERFREE TV 1.5

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Aceptar licencias Android
        run: yes | sdkmanager --licenses || true

      - name: Descomprimir INTERFREE TV 1.5
        shell: bash
        run: |
          set -euo pipefail
          unzip -q InterfreeTV_1.5.zip -d proyecto_extraido
          PROJECT_DIR="$GITHUB_WORKSPACE/proyecto_extraido/InterfreeTV"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: No se encontró settings.gradle.kts"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Construir APK
        run: |
          gradle -p "$PROJECT_DIR" --no-daemon assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: INTERFREE-TV-1.5
          path: proyecto_extraido/InterfreeTV/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
