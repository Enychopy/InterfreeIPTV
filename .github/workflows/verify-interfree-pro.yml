
name: Verify INTERFREE TV PRO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descargar APK original
        run: |
          curl -L --fail -o Red4TVibo.apk \
            https://github.com/Enychopy/InterfreeIPTV/releases/download/ibo-original/Red4TVibo.apk

      - name: Descargar Apktool
        run: |
          curl -L --fail -o apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar

      - name: Descompilar APK original
        run: |
          java -jar apktool.jar d -f Red4TVibo.apk -o decoded

      - name: Cambiar paquete y nombre
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = "com.apps.red4tv"
          new = "com.interfree.tvpro"
          root = Path("decoded")

          for file in root.rglob("*"):
              if file.is_file():
                  try:
                      content = file.read_text(encoding="utf-8")
                      updated = content.replace(old, new)
                      updated = updated.replace("Red4TV", "INTERFREE TV PRO")
                      if updated != content:
                          file.write_text(updated, encoding="utf-8")
                  except (UnicodeDecodeError, OSError):
                      pass

          manifest = root / "AndroidManifest.xml"
          content = manifest.read_text(encoding="utf-8")
          content = content.replace(old, new)
          content = content.replace("Red4TV", "INTERFREE TV PRO")
          manifest.write_text(content, encoding="utf-8")
          PY

      - name: Descargar e instalar logo INTERFREE
        run: |
          curl -L --fail -o interfree-logo.png \
            https://raw.githubusercontent.com/Enychopy/InterfreeIPTV/main/file_000000000d3882129015abab734c95d8.png

          python3 -m pip install --break-system-packages Pillow

          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          logo = Image.open("interfree-logo.png").convert("RGBA")
          root = Path("decoded/res")
          count = 0

          for file in root.rglob("*"):
              if not file.is_file():
                  continue

              if file.suffix.lower() not in (".png", ".webp"):
                  continue

              name = file.stem.lower()
              if "ic_launcher" not in name and "launcher_icon" not in name:
                  continue

              try:
                  original = Image.open(file)
                  size = original.size
                  resized = logo.resize(size, Image.Resampling.LANCZOS)
                  resized.save(file, format="PNG")
                  count += 1
                  print(f"Actualizado: {file} ({size[0]}x{size[1]})")
              except Exception as error:
                  print(f"No se pudo actualizar {file}: {error}")

          if count == 0:
              raise SystemExit("No se encontraron iconos del lanzador.")
          
          print(f"Total de recursos actualizados: {count}")
          PY

      - name: Compilar APK
        run: |
          java -jar apktool.jar b decoded -o INTERFREE-TV-PRO-unsigned.apk

      - name: Firmar APK
        run: |
          curl -L --fail -o uber-apk-signer.jar \
            https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

          java -jar uber-apk-signer.jar \
            --apks INTERFREE-TV-PRO-unsigned.apk \
            --out signed \
            --allowResign

      - name: Verificar firma y paquete
        run: |
          APK=$(find signed -name '*.apk' -print -quit)
          test -n "$APK"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          java -jar apktool.jar d -f "$APK" -o verified

          grep -q 'package="com.interfree.tvpro"' verified/AndroidManifest.xml
          echo "VERIFICACION COMPLETADA"

      - name: Guardar APK verificada
        uses: actions/upload-artifact@v4
        with:
          name: INTERFREE-TV-PRO-LOGO-NUEVO
          path: signed/*.apk
          if-no-files-found: error
